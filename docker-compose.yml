services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: scrapitero_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: scrapitero
      POSTGRES_USER: scrap
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrap -d scrapitero"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
