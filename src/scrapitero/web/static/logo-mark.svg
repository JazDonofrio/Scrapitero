<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" role="img" aria-label="AI Mapping">
  <title>AI Mapping</title>
  <!-- Glifo de marca de AI Mapping: la "A" del wordmark resuelta como triángulo con
       degradé teal→índigo, con un pin de mapa en el centro y una muesca entre las patas.
       Va como favicon y en el header, donde el wordmark completo no entra.
       El pin se dibuja como CALADO (fill-rule evenodd) y no como relleno blanco: así el
       glifo se lee igual sobre el fondo claro y sobre el oscuro. -->
  <defs>
    <linearGradient id="aimGrad" x1="0.18" y1="0" x2="0.42" y2="1">
      <stop offset="0" stop-color="#3cb8a5"/>
      <stop offset="1" stop-color="#4b6aa1"/>
    </linearGradient>
  </defs>

  <!-- "A": apex redondeado, patas con esquinas redondeadas y muesca en la base -->
  <path fill="url(#aimGrad)" d="
    M 86,16 C 90,6 100,6 104,16
    L 186,163 C 193,176 186,181 176,181
    L 122,181 C 113,157 77,157 68,181
    L 24,181 C 14,181 7,176 14,163 Z"/>

  <!-- pin: anillo exterior + cola, calado en una sola figura (evenodd) -->
  <path fill="#fff" fill-rule="evenodd" d="
    M 71.7,121.4 A 39,39 0 1 1 108.3,121.4 L 91,152 Z
    M 75.4,114.4 A 31,31 0 1 1 104.6,114.4 L 91,141 Z"/>

  <!-- centro del pin: dona blanca con el degradé asomando en el hueco -->
  <circle cx="90" cy="87" r="20" fill="none" stroke="#fff" stroke-width="10"/>
</svg>
