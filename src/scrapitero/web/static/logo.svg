<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" role="img" aria-label="AI Mapping">
  <title>AI Mapping</title>
  <!-- Wordmark horizontal: el glifo de logo-mark.svg + "AiMapping".
       Un SVG servido por <img> es un documento aislado y NO puede cargar Google Fonts, así
       que el texto va con una pila de fuentes del sistema de tono geométrico. Donde la
       fidelidad tipográfica importa (header y login) la marca se arma en HTML, con
       Space Grotesk ya cargada por theme.css — ver la clase .brand. -->
  <defs>
    <linearGradient id="aimGradW" x1="0.18" y1="0" x2="0.42" y2="1">
      <stop offset="0" stop-color="#3cb8a5"/>
      <stop offset="1" stop-color="#4b6aa1"/>
    </linearGradient>
  </defs>

  <path fill="url(#aimGradW)" d="
    M 86,16 C 90,6 100,6 104,16
    L 186,163 C 193,176 186,181 176,181
    L 122,181 C 113,157 77,157 68,181
    L 24,181 C 14,181 7,176 14,163 Z"/>
  <path fill="#fff" fill-rule="evenodd" d="
    M 71.7,121.4 A 39,39 0 1 1 108.3,121.4 L 91,152 Z
    M 75.4,114.4 A 31,31 0 1 1 104.6,114.4 L 91,141 Z"/>
  <circle cx="90" cy="87" r="20" fill="none" stroke="#fff" stroke-width="10"/>

  <text x="215" y="135"
        font-family="'Space Grotesk', 'Century Gothic', 'Avenir Next', system-ui, sans-serif"
        font-size="118" font-weight="700" letter-spacing="-3">
    <tspan fill="#3cb8a5">Ai</tspan><tspan fill="#4b6aa1">Mapping</tspan>
  </text>
</svg>
