[project]
name = "scrapitero"
version = "0.1.0"
description = "Plataforma multi-agente de relevamiento catastral geoestructurado"
requires-python = ">=3.11"
dependencies = [
    # Geo vectorial
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "pyproj>=3.6",
    "mercantile>=1.2",          # quadkeys para MS Building Footprints

    # Base de datos
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",

    # Procesamiento intermedio de archivos pesados
    "duckdb>=0.10",

    # HTTP + caché en disco
    "httpx>=0.27",
    "hishel>=0.0.30",

    # Modelos de datos
    "pydantic>=2.7",

    # CLI y observabilidad
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",

    # HITL Telegram
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
scrapitero = "scrapitero.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapitero"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
